name: "🏢 [GEN] Blank Issue"
description: "Don't see your issue template? Open a blank issue."
title: "[tag] Text String"
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ### 🏷️ Title Instructions
        **Order tags from general to specific (UPPERCASE, ONE WORD per tag).**

        Template examples:
        `[PROJECT] [MILESTONE] [DELIVERABLE] Brief task description`
        `[PROJECT] [ITEM] [DELIVERABLE] Brief task description`
        `[OBJECTIVE] [YEAR] [AREA] Objective name`

        📘 Related procedure: [P.062 - Create Issue](https://documentation.embention.net/062/en/latest/)

  - type: textarea
    id: references
    attributes:
      label: References
      description: One full URL per line for the related tasks.
      placeholder: "- https://github.com/embention/Embention/issues/12345"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### Description Instructions

        **Changes / Activity Description**
        Describe the activity or proposed change, why it is needed and the expected outcome.

        **Affected Processes / Procedures**
        List affected processes, procedures and documents, with links and a brief description of the impact. State "None" if no impact is identified, or "To be assessed" if unknown.

        **Notification**
        Add a comment with @mentions of the people or teams to notify.

        If the change affects the Quality Management System, or the impact is uncertain, @mention the CQO or a Quality team member.

  - type: textarea
    id: description
    attributes:
      label: Description
      value: |
        #### Changes / Activity Description

        #### Affected Processes / Procedures

        #### Notification
    validations:
      required: true
